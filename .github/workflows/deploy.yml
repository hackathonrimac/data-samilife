name: Deploy to Amazon ECR

on:
  push:
    branches: [ "main" ]

env:
  AWS_REGION: us-east-1                   # Tu región de AWS

jobs:
  # ----------------------------------------------------------
  # JOB 1: BACKEND
  # Se ejecuta solo si hay cambios en la carpeta 'src/backend' o archivos raíz
  # ----------------------------------------------------------
  deploy-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    # Este filtro asegura que solo se ejecute si tocas el backend o los requirements
    if: |
      contains(github.event.head_commit.modified, 'src/backend/') || 
      contains(github.event.head_commit.modified, 'requirements.txt')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPO_BACKEND }}
        IMAGE_TAG: latest
      run: |
        # Construimos desde la raíz (.) para poder acceder a requirements.txt si es necesario
        # Pero apuntamos al Dockerfile específico (-f)
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f src/backend/Dockerfile .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  # ----------------------------------------------------------
  # JOB 2: FRONTEND
  # Se ejecuta solo si hay cambios en la carpeta 'src/frontend'
  # ----------------------------------------------------------
  deploy-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.modified, 'src/frontend/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPO_FRONTEND }}
        IMAGE_TAG: latest
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -f src/frontend/Dockerfile .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG