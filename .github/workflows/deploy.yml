name: Deploy to Amazon ECR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:      # Botón manual activado

env:
  AWS_REGION: us-east-1

jobs:
  deploy-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    # Filtro robusto: Se ejecuta si es manual O si hay cambios en src/backend o requirements.txt
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJson(github.event.head_commit.modified), 'src/backend/') || 
      contains(toJson(github.event.head_commit.modified), 'requirements.txt')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} 
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPO_BACKEND }}
        IMAGE_TAG: latest
      run: |
        # CAMBIO CLAVE: Entramos a la carpeta para usarla como contexto de build
        cd src/backend
        
        # Construye usando el contexto actual ('.', que es src/backend)
        # Esto hace que el Dockerfile use rutas cortas como 'COPY requirements.txt .'
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

  deploy-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    # Filtro robusto: Se ejecuta si es manual O si hay cambios en src/frontend
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(toJson(github.event.head_commit.modified), 'src/frontend/')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }} 
        aws-region: ${{ env.AWS_REGION }}

    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v1

    - name: Build, tag, and push image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ secrets.ECR_REPO_FRONTEND }}
        IMAGE_TAG: latest
      run: |
        # CAMBIO CLAVE: Entramos a la carpeta para usarla como contexto de build
        cd src/frontend
        
        # Construye usando el contexto actual ('.', que es src/frontend)
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG